<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>公式小站</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-48.png" width="44" height="44" alt="">
        <div class="brand-copy">
          <p class="eyebrow">FORMULA NOTE</p>
          <h1>公式小站</h1>
        </div>
        <span class="version">v5.0</span>
      </header>

      <section class="connection" id="connection" data-state="checking" aria-live="polite">
        <span class="status-dot"></span>
        <div>
          <strong id="connection-title">正在连接…</strong>
          <p id="connection-detail">ChatGPT</p>
        </div>
      </section>

      <section class="metrics" aria-label="当前页面统计">
        <div><strong id="formula-count">—</strong><span>公式</span></div>
        <div><strong id="message-count">—</strong><span>消息</span></div>
        <div><strong>Local</strong><span>本地</span></div>
      </section>

      <section class="feature-card">
        <div class="feature"><span class="feature-icon">Σ</span><strong>公式</strong></div>
        <div class="feature"><span class="feature-icon">M↓</span><strong>Markdown</strong></div>
      </section>

      <div class="actions">
        <button id="open-copy" class="primary" type="button" disabled><span>复制公式</span><span>→</span></button>
        <button id="open-export" type="button" disabled><span>整理对话</span><span>.md</span></button>
        <button id="open-chatgpt" type="button"><span>去 ChatGPT</span><span>↗</span></button>
      </div>

      <p class="privacy">内容只在本机整理，不会上传。</p>
      <nav>
        <a href="https://github.com/yzhi51161-cmd/chatgpt-formula-copy" target="_blank" rel="noreferrer">GitHub</a>
        <span>·</span>
        <a href="https://github.com/yzhi51161-cmd/chatgpt-formula-copy/issues" target="_blank" rel="noreferrer">反馈</a>
      </nav>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
