<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT 公式复制</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-48.png" width="40" height="40" alt="">
        <div>
          <h1>ChatGPT 公式复制</h1>
          <p class="status"><span></span>扩展已启用</p>
        </div>
      </header>

      <section>
        <p>在 ChatGPT 中单击公式，或框选包含公式的整段文字后按 <kbd>Ctrl</kbd> + <kbd>C</kbd>。</p>
        <p class="privacy">仅在本机读取当前 ChatGPT 页面中的公式并完成复制，不上传页面内容。</p>
      </section>

      <button id="open-chatgpt" type="button">打开 ChatGPT</button>
      <nav>
        <a href="https://github.com/yzhi51161-cmd/chatgpt-formula-copy" target="_blank" rel="noreferrer">项目主页</a>
        <a href="https://github.com/yzhi51161-cmd/chatgpt-formula-copy/issues" target="_blank" rel="noreferrer">反馈问题</a>
      </nav>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
